<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="purpleBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  
  <!-- Vibrant Purple Background Badge -->
  <rect width="32" height="32" rx="7" fill="url(#purpleBg)"/>
  
  <!-- Rocket Icon (Lucide Rocket shape with high contrast) -->
  <g transform="translate(4, 4) scale(1)">
    <!-- Thruster exhaust flame in vivid mint/green -->
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" fill="#34d399" stroke="#34d399" stroke-width="1.5"/>
    
    <!-- Rocket Main Hull in pure white -->
    <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wings / Fins -->
    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Porthole Window -->
    <circle cx="15.5" cy="8.5" r="1.5" fill="#6d28d9"/>
  </g>
</svg>
